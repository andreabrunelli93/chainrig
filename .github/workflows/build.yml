name: Build

# Every push builds Windows and macOS and keeps the zips as workflow artifacts.
# Pushing a version tag (v1.2.3) also publishes them as a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # No explicit generator: CMake picks the newest Visual Studio installed on the runner
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/ChainRig_artefacts/Release/ChainRig.exe -DestinationPath ChainRig-Windows-x64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ChainRig-Windows-x64
          path: ChainRig-Windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure (universal, Apple Silicon and Intel)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build -j4

      # Ad-hoc signature for the whole bundle (the app is not notarized)
      - name: Sign and package
        run: |
          codesign --force --deep --sign - build/ChainRig_artefacts/Release/ChainRig.app
          ditto -c -k --keepParent build/ChainRig_artefacts/Release/ChainRig.app ChainRig-macOS.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ChainRig-macOS
          path: ChainRig-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
