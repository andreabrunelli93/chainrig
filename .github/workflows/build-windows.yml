name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # No explicit generator: CMake picks the newest Visual Studio installed on the runner
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v5
        with:
          name: ChainRig-Windows
          path: build/ChainRig_artefacts/Release/ChainRig.exe
